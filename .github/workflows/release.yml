name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ---- 前端 PWA 构建 + 部署 GitHub Pages ----
  pwa:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      # Pages 上没有后端：用默认 mock 模式构建（浏览器内演示数据），
      # real 模式是给连真实 SpringBoot 的部署（本地/VPS）用的
      - run: cd frontend && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # ---- 浏览器插件打包 + Release ----
  # 先行创建 GitHub Release，后续 desktop / android job 把各自资产挂上来
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd extension && zip -r ../xiangets-extension-${{ github.ref_name }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: xiangets-extension-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true

  # ---- 桌面端（Tauri）：macOS universal dmg / Windows msi+exe / Linux AppImage+deb+rpm ----
  desktop:
    needs: extension
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13（Intel 原生）runner 长期排不上队，改在 Apple Silicon 上
          # 交叉编译 universal dmg，一个包同时覆盖 Intel 与 Apple Silicon
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - name: 增加 x86_64 目标（universal dmg 需要）
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - name: 安装 Linux WebView 依赖（Tauri 需要）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: '弦歌 ${{ github.ref_name }}'
          releaseBody: '桌面端与 Android 均为 Mock 演示模式（内置语料、本地数据）；连自建后端见 README。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ---- Android APK（Capacitor）----
  android:
    needs: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - name: 准备签名 keystore（Secrets 提供则解码，否则临时生成兜底）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/xiangets.keystore
            echo "使用正式签名 keystore"
          else
            keytool -genkeypair -v -keystore /tmp/xiangets.keystore \
              -alias xiangets -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" \
              -dname "CN=XianGets, OU=Dev, O=XianGets, C=CN"
            echo "⚠️ 未配置 Secrets，使用临时 keystore（升级安装需先卸载旧版）"
          fi
      - run: cd frontend && npm ci && npm run build && npx cap sync android
      - name: 构建 Release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE: /tmp/xiangets.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: xiangets
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: 重命名并上传 APK
        run: |
          mv frontend/android/app/build/outputs/apk/release/app-release.apk \
             xiangets-android-${{ github.ref_name }}.apk
        # softprops 上传（Release 已由 extension job 创建）
      - uses: softprops/action-gh-release@v2
        with:
          files: xiangets-android-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
