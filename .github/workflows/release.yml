name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ---- 前端 PWA 构建 + 部署 GitHub Pages ----
  pwa:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      # Pages 上没有后端：用默认 mock 模式构建（浏览器内演示数据），
      # real 模式是给连真实 SpringBoot 的部署（本地/VPS）用的
      - run: cd frontend && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # ---- 浏览器插件打包 + Release ----
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd extension && zip -r ../xiangets-extension-${{ github.ref_name }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: xiangets-extension-v${{ github.ref_name }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true

