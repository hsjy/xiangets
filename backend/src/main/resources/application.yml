server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: yuetin-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:yuetin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 兼容旧库：已由旧版 sql.init 建好的库记为 baseline(V1)，只执行后续迁移
    baseline-on-migrate: true
    baseline-version: 1

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.yuetin.music.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 业务配置
yuetin:
  jwt:
    # 生产环境务必用环境变量覆盖
    secret: ${JWT_SECRET:yuetin-music-secret-2024}
    expire-days: 7
  cors:
    # 允许的前端来源，逗号分隔；* 表示不限制
    allowed-origins: ${CORS_ORIGINS:*}
  audio-dir: ${AUDIO_DIR:./audio}

logging:
  level:
    com.yuetin.music: debug
