# ============================================================
# 弦歌 · 生产 nginx 配置
# 职责：1) 托管前端静态文件  2) 反代 /api 给后端  3) 直出音频（带长缓存）
# ============================================================

server {
    listen 80;
    # 生产填你的域名，如 server_name xiangets.com www.xiangets.com;
    server_name _;

    # 上传体积上限（感悟/头像等请求）
    client_max_body_size 10m;

    # 压缩：文本类资源传输体积减 60% 以上
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 静态前端（构建产物已烘焙进镜像）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA 兜底：单页应用刷新时把任意路径都回退到 index.html
        # （本项目用 hash 路由，理论上不需要，但留着无害且兼容未来切换 history 模式）
        try_files $uri $uri/ /index.html;

        # 指纹资源长缓存；index.html 不缓存，保证发版即时生效
        location ~* \.(js|css|png|jpg|svg|woff2?)$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # 音频直出：nginx 直接读共享卷，不经过后端，快且省后端资源
    location /api/audio/ {
        alias /srv/audio/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 卷里还没有的文件（如刚生成）回退给后端兜底
        try_files $uri @backend;
    }

    # 业务接口反代
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 问诗/谱曲是长请求，放宽读超时
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location @backend {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ----------------------------------------------------------
    # 上 HTTPS 时：
    #   1) docker compose 里解开 443 端口与 ./certs 卷
    #   2) 用 certbot 或云厂商证书把 fullchain.pem/privkey.pem 放进 certs/
    #   3) 打开下面的 443 server 块，并把上面 80 块改为 301 跳转 https
    # ----------------------------------------------------------
    # listen 443 ssl;
    # http2 on;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # if ($scheme = http) { return 301 https://$host$request_uri; }
}
